name: CI

# Builds and tests the five live crates — the embedded `rmi` framework, the
# prototype compiler/evaluator, the Ribosome build engine, the Germline RSI
# control plane, and the Forge registry. The old forked-rustc compiler CI was
# removed with that compiler; this is the accurate, working pipeline for what
# ships today.
#
# They are separate Cargo workspaces on purpose (see ARCHITECTURE.md
# §"Repository layout"), so each gets its own --manifest-path job rather than a
# single root `cargo test`. `scripts/test-all.{sh,ps1}` runs the same set
# locally.
#
# Two in-repo path dependencies decide the paths filters: `prototype` depends on
# RecursiveMachineIntelligence, and `germline` depends on `ribosome`. A change to
# either dependency can break its dependent, so both appear in every filter.

on:
  push:
    branches: [master]
    paths:
      - "prototype/**"
      - "forge/**"
      - "ribosome/**"
      - "germline/**"
      - "RecursiveMachineIntelligence/**"
      - ".github/workflows/ci.yml"
      # The docs job asserts these files agree with the suites.
      - "scripts/**"
      - "ROADMAP.md"
      - "MEASUREMENTS.md"
      - "ARCHITECTURE.md"
      - "RIBOSOME.md"
      - "GERMLINE.md"
  pull_request:
    paths:
      - "prototype/**"
      - "forge/**"
      - "ribosome/**"
      - "germline/**"
      - "RecursiveMachineIntelligence/**"
      - ".github/workflows/ci.yml"
      # The docs job asserts these files agree with the suites.
      - "scripts/**"
      - "ROADMAP.md"
      - "MEASUREMENTS.md"
      - "ARCHITECTURE.md"
      - "RIBOSOME.md"
      - "GERMLINE.md"

jobs:
  rmi:
    name: rmi — build + test (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path RecursiveMachineIntelligence/Cargo.toml --no-default-features --features cpu
      - name: Test
        run: cargo test --manifest-path RecursiveMachineIntelligence/Cargo.toml --no-default-features --features cpu

  prototype:
    name: prototype — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path prototype/Cargo.toml
      - name: Test
        run: cargo test --release --manifest-path prototype/Cargo.toml
      - name: Evaluator correctness bench (73/73 exact)
        run: cargo test --release --manifest-path prototype/Cargo.toml eval_bench -- --ignored --nocapture
      # `mage-parse@<version>` is the tool id Ribosome writes into every action
      # key, so if the binary and the registry disagree the cache is keyed on a
      # version that never ran. They live in different crates with no compiler
      # relationship between them — exactly the kind of pairing that drifts —
      # so the agreement is checked rather than assumed.
      # MAGE_ONTOLOGY.json is generated from the implementation and DOCS.md tells
      # readers to *prefer* it over the prose. It was committed on 2026-06-12
      # and never regenerated, so it advertised ABL container version 2 while
      # the encoder had moved to 3 — and `decode` rejects a version mismatch, so
      # anyone building to the published ontology produced artifacts this
      # toolchain refuses. A generated file that is committed but not checked is
      # just a stale file with extra authority.
      - name: Committed ontology matches a fresh generation
        run: |
          cargo run --quiet --release --manifest-path prototype/Cargo.toml \
            --bin mage-parse -- --emit-ontology /tmp/onto-fresh.json
          diff MAGE_ONTOLOGY.json /tmp/onto-fresh.json || {
            echo "::error::MAGE_ONTOLOGY.json is stale — regenerate with --emit-ontology"
            exit 1
          }
      # The shipped examples are data, not tests, so `cargo test` never touched
      # them and 11 of 12 had stopped typechecking unnoticed. All 12 now
      # typecheck and run; this pins the answer each one prints, because two of
      # them ran clean and printed the wrong thing. Fails if an example stops
      # checking, stops running, changes its output, or arrives with no
      # recorded answer at all.
      - name: Example programs match their recorded state
        run: bash scripts/check-examples.sh
      # The examples check covers the twelve in `examples/`. Nothing covered
      # the other 89 `.mg` files in the repo, and 36 of them do not typecheck —
      # `stdlib/` is 4,402 lines of Rust behind a MAGE extension, read by
      # nothing and checked by nothing. A file with no consumer has no error
      # message; this is the consumer. The sketch list can only shrink.
      - name: Every .mg source typechecks or is a listed sketch
        run: bash scripts/check-mg-sources.sh
      # 258 MAGE-tagged code blocks live in the markdown, and 177 of them did
      # not parse when anyone first checked — Rust `::` paths, Rust signatures,
      # brace imports — in the guides an agent reads to learn the language, and
      # in `training/prompts/`, whose few-shot blocks teach a model what MAGE
      # looks like. They are all fixed; the baseline is empty, so this now
      # fails on any new one.
      - name: Every documentation block typechecks
        run: bash scripts/check-doc-blocks.sh
      # And `--check` is only one of the two oracles. Running the blocks that
      # define an entry point found that thirteen of the seventeen registered
      # builtins — `assert` among them — had no arm in the evaluator at all.
      - name: Every documentation entry point runs
        run: bash scripts/check-doc-evals.sh
      # The ontology published six "CI floors" and this workflow enforced none
      # of them — the section's own doc comment said they were read from this
      # file. Three are measurable and now are.
      - name: Published reliability floors hold
        run: bash scripts/check-ci-floors.sh
      - name: Compiler version matches Ribosome's registry entry
        run: |
          binv=$(cargo run --quiet --release --manifest-path prototype/Cargo.toml \
                   --bin mage-parse -- --version | awk '{print $2}')
          regv=$(grep -oE 'structural\("mage-parse", "[0-9.]+"\)' ribosome/src/lang.rs \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "binary=$binv registry=$regv"
          [ "$binv" = "$regv" ] || {
            echo "::error::mage-parse reports $binv but ribosome keys $regv"
            exit 1
          }

  ribosome:
    name: ribosome — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path ribosome/Cargo.toml
      - name: Test
        run: cargo test --manifest-path ribosome/Cargo.toml
      # Two properties, one check.
      #
      # The engine must not acquire a dependency on the language it builds:
      # `lang`'s claim that no language is privileged below the planner is only
      # credible while this holds.
      #
      # And it must not reach `germline`. That barrier is deliberately one-way —
      # a build engine able to call into the succession layer is a somatic path
      # into the germline, which is the failure GERMLINE.md exists to prevent.
      #
      # Both erode by one convenient `use`, so both are checked rather than
      # asserted in a doc.
      - name: Verify the engine depends on no MAGE crate and not on germline
        run: |
          if cargo tree --manifest-path ribosome/Cargo.toml --prefix none --no-dedupe \
               | grep -Eiv '^ribosome ' | grep -Eiq '^(mage|forge|rmi|germline)'; then
            echo "::error::ribosome must depend on neither a MAGE crate nor germline"
            exit 1
          fi
      # `tls` is optional so that encryption is not bought at the cost of making
      # every consumer carry a TLS stack. That is only true while it stays out of
      # the default build — `-e normal` because dev-dependencies are not
      # propagated to consumers and would make this read as a violation when it
      # is not.
      - name: Verify the default build carries no TLS stack
        run: |
          if cargo tree --manifest-path ribosome/Cargo.toml -e normal --prefix none \
               | grep -Eiq '^(rustls|ring) '; then
            echo "::error::the tls feature has leaked into the default build"
            exit 1
          fi

  ribosome-tls:
    name: ribosome — tls feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # An optional feature nobody builds is an optional feature that stops
      # compiling. The TLS tests stand up a real rustls session over loopback
      # with a certificate generated in-test, including the negative cases.
      - name: Test with the tls feature
        run: cargo test --manifest-path ribosome/Cargo.toml --features tls

  germline:
    name: germline — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path germline/Cargo.toml
      - name: Test
        run: cargo test --manifest-path germline/Cargo.toml

  forge:
    name: forge — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path forge/Cargo.toml
      - name: Test
        run: cargo test --manifest-path forge/Cargo.toml

  docs:
    name: documented test counts match reality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Runs every suite again rather than reusing the per-crate jobs, because
      # the check must compare against numbers from one coherent run. Splitting
      # the measurement across jobs would let a doc match a total nothing
      # actually produced.
      #
      # This exists because four documented figures were found stale on
      # 2026-08-04, each by accident. A summary line is written once while its
      # subject is fresh and nothing ever forces a second look — so the second
      # look is now a job.
      - name: Test everything and verify the documented counts
        run: bash scripts/test-all.sh --check-docs

  audit:
    name: RustSec advisories across all five lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # Dependabot reported zero Rust alerts while `cargo audit` found
      # RUSTSEC-2026-0204 in two lockfiles, so "Dependabot is quiet" was not
      # evidence that the Rust side was clean. Each workspace has its own
      # Cargo.lock and is scanned separately — a vulnerability in one says
      # nothing about the others.
      #
      # `-D warnings` is deliberately NOT set: the remaining findings are
      # `unmaintained` and `unsound` advisories in transitive deps with no
      # patched version to move to. Failing on those would make this job
      # permanently red and therefore ignored, which is worse than not having
      # it. Vulnerabilities fail; warnings are printed and read.
      # `rmi` git-ignores its Cargo.lock so the vendored crate does not inherit
      # this repo's pins, so there is nothing to audit until one is generated.
      # Generating it is also the more useful check for that crate: it audits
      # what a fresh consumer would actually resolve, rather than one
      # developer's working copy — the distinction that made a `crossbeam-epoch`
      # hit there a false alarm while the identical hit in `prototype` was real.
      - name: cargo audit
        run: |
          for c in RecursiveMachineIntelligence prototype ribosome germline forge; do
            echo "::group::$c"
            ( cd "$c" \
              && { [ -f Cargo.lock ] || cargo generate-lockfile; } \
              && cargo audit ) || exit 1
            echo "::endgroup::"
          done

  cuda:
    name: prototype — cuda feature (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # IronAccelerator dispatches through libloading at runtime, so the CUDA
      # backend compiles with no CUDA toolkit and no GPU present — a runner
      # without a driver can still prove the code builds. It cannot prove the
      # kernels are *correct*: that needs `cargo test --features cuda` on a
      # CUDA box (dual 3090 Ti locally, 1,071 tests green).
      - name: Compile-check the CUDA backend
        run: cargo check --manifest-path prototype/Cargo.toml --features cuda --all-targets

  cuda-gpu:
    name: prototype — cuda kernels (self-hosted GPU)
    # Only runs where a GPU runner actually exists. Without this guard the job
    # would sit queued forever on a fork or a fresh clone and read as "CI is
    # broken" rather than "this repo has no GPU runner", which is the honest
    # state for anyone but the maintainer.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Report the device the results belong to
        # Kernel results are only meaningful attached to the hardware that
        # produced them; a green tick with no device recorded is not evidence.
        run: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
      - name: Run the CUDA test suite on real hardware
        run: cargo test --release --manifest-path prototype/Cargo.toml --features cuda
      - name: CPU-vs-GPU harness
        run: cargo run --release --manifest-path prototype/Cargo.toml --features cuda --bin cuda-bench
