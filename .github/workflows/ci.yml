name: CI

# Builds and tests the five live crates — the embedded `rmi` framework, the
# prototype compiler/evaluator, the Ribosome build engine, the Germline RSI
# control plane, and the Forge registry. The old forked-rustc compiler CI was
# removed with that compiler; this is the accurate, working pipeline for what
# ships today.
#
# They are separate Cargo workspaces on purpose (see ARCHITECTURE.md
# §"Repository layout"), so each gets its own --manifest-path job rather than a
# single root `cargo test`. `scripts/test-all.{sh,ps1}` runs the same set
# locally.
#
# Two in-repo path dependencies decide the paths filters: `prototype` depends on
# RecursiveMachineIntelligence, and `germline` depends on `ribosome`. A change to
# either dependency can break its dependent, so both appear in every filter.

on:
  push:
    branches: [master]
    paths:
      - "prototype/**"
      - "forge/**"
      - "ribosome/**"
      - "germline/**"
      - "RecursiveMachineIntelligence/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "forge/**"
      - "ribosome/**"
      - "germline/**"
      - "RecursiveMachineIntelligence/**"
      - ".github/workflows/ci.yml"

jobs:
  rmi:
    name: rmi — build + test (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path RecursiveMachineIntelligence/Cargo.toml --no-default-features --features cpu
      - name: Test
        run: cargo test --manifest-path RecursiveMachineIntelligence/Cargo.toml --no-default-features --features cpu

  prototype:
    name: prototype — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path prototype/Cargo.toml
      - name: Test
        run: cargo test --release --manifest-path prototype/Cargo.toml
      - name: Evaluator correctness bench (73/73 exact)
        run: cargo test --release --manifest-path prototype/Cargo.toml eval_bench -- --ignored --nocapture

  ribosome:
    name: ribosome — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path ribosome/Cargo.toml
      - name: Test
        run: cargo test --manifest-path ribosome/Cargo.toml
      # Two properties, one check.
      #
      # The engine must not acquire a dependency on the language it builds:
      # `lang`'s claim that no language is privileged below the planner is only
      # credible while this holds.
      #
      # And it must not reach `germline`. That barrier is deliberately one-way —
      # a build engine able to call into the succession layer is a somatic path
      # into the germline, which is the failure GERMLINE.md exists to prevent.
      #
      # Both erode by one convenient `use`, so both are checked rather than
      # asserted in a doc.
      - name: Verify the engine depends on no MAGE crate and not on germline
        run: |
          if cargo tree --manifest-path ribosome/Cargo.toml --prefix none --no-dedupe \
               | grep -Eiv '^ribosome ' | grep -Eiq '^(mage|forge|rmi|germline)'; then
            echo "::error::ribosome must depend on neither a MAGE crate nor germline"
            exit 1
          fi

  germline:
    name: germline — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path germline/Cargo.toml
      - name: Test
        run: cargo test --manifest-path germline/Cargo.toml

  forge:
    name: forge — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path forge/Cargo.toml
      - name: Test
        run: cargo test --manifest-path forge/Cargo.toml

  cuda:
    name: prototype — cuda feature (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # IronAccelerator dispatches through libloading at runtime, so the CUDA
      # backend compiles with no CUDA toolkit and no GPU present — a runner
      # without a driver can still prove the code builds. It cannot prove the
      # kernels are *correct*: that needs `cargo test --features cuda` on a
      # CUDA box (dual 3090 Ti locally, 1,269 tests green).
      - name: Compile-check the CUDA backend
        run: cargo check --manifest-path prototype/Cargo.toml --features cuda --all-targets

  cuda-gpu:
    name: prototype — cuda kernels (self-hosted GPU)
    # Only runs where a GPU runner actually exists. Without this guard the job
    # would sit queued forever on a fork or a fresh clone and read as "CI is
    # broken" rather than "this repo has no GPU runner", which is the honest
    # state for anyone but the maintainer.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Report the device the results belong to
        # Kernel results are only meaningful attached to the hardware that
        # produced them; a green tick with no device recorded is not evidence.
        run: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
      - name: Run the CUDA test suite on real hardware
        run: cargo test --release --manifest-path prototype/Cargo.toml --features cuda
      - name: CPU-vs-GPU harness
        run: cargo run --release --manifest-path prototype/Cargo.toml --features cuda --bin cuda-bench
