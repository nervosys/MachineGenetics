[workspace]

[package]
name = "arena"
version = "0.1.0"
edition = "2021"
description = "The arena — agents that generate MAGE programs, learners that predict their output, and a shared multi-objective front measured in joules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nervosys/MAGE"

# The arena is where the loop becomes self-driven, so it is the one crate that
# needs both halves: the language (`prototype`, to check and run the programs
# agents write) and the control plane (`germline`, for Pareto selection). Neither
# of those learns about the other through this crate — the forest stays a forest:
#
#     rmi <- prototype <- arena -> germline -> ribosome
[dependencies]
mage-prototype = { path = "../prototype" }
germline = { path = "../germline" }
# For `Digest`, the type germline's Workload speaks. A direct edge: the graph
# stays acyclic, and ribosome still depends on no MAGE crate.
ribosome = { path = "../ribosome" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# NVML is loaded at run time rather than linked, so the crate builds and runs on
# machines with no NVIDIA driver and simply reports energy as unavailable there.
libloading = "0.8"
# The transformer learner (plan task 4.2). Optional: the default build is the
# n-gram learner only, and needs no ML stack. `gpu` adds CUDA, whose Windows
# build needs MSVC's environment and NVCC_APPEND_FLAGS=-Xcompiler /Zc:preprocessor
# (see src/transformer.rs).
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

[features]
transformer = ["dep:candle-core", "dep:candle-nn"]
gpu = ["transformer", "candle-core/cuda", "candle-nn/cuda"]

[[bin]]
name = "arena"
path = "src/main.rs"

# Line tables only in debug builds. The arena's test binary links prototype,
# rmi, germline, ribosome and ed25519, and with full debug info it exceeded the
# MSVC linker's program-database limit (LNK1140) once the succession tests
# arrived. Backtraces keep file and line; locals are what is given up.
[profile.dev]
debug = "line-tables-only"
