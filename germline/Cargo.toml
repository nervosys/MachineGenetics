[workspace]

[package]
name = "germline"
version = "0.1.0"
edition = "2021"
description = "Germline — model succession, handoff, and fallback: the RSI control plane"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nervosys/MAGE"

# Depends on the build engine and nothing else in this repository. The direction
# is load-bearing: the Weismann barrier this crate enforces is one-way, so
# `ribosome` must never be able to reach back into succession. CI checks it.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ribosome = { path = "../ribosome" }

[dev-dependencies]
# The registry, for the gene-pool adapter in tests/gene_pool.rs only.
#
# A dev-dependency on purpose: germline holds heritable material and must not
# know what a registry is, forge stores blocks and must not know what a genome
# is, and dev-dependencies do not propagate to consumers. The adapter is
# demonstrated without either library gaining an edge on the other.
forge = { path = "../forge" }
